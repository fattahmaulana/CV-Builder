<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Neobrutalist Hard Shadow -->
  <rect x="8" y="8" width="50" height="50" rx="8" fill="#000000" />
  
  <!-- Main Card Surface (Yellow #FFE500) -->
  <rect x="5" y="5" width="50" height="50" rx="8" fill="#FFE500" stroke="#000000" stroke-width="4" />
  
  <!-- Document Fold / Top Accent (Pink #FF6B9D) -->
  <rect x="37" y="5" width="18" height="14" rx="3" fill="#FF6B9D" stroke="#000000" stroke-width="3" />
  
  <!-- Stylized CV Monogram -->
  <text x="14" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#000000" letter-spacing="-1">CV</text>
  
  <!-- Micro Star / Spark -->
  <polygon points="46,12 47.5,15 50.5,15.5 48,17.5 49,20.5 46,18.5 43,20.5 44,17.5 41.5,15.5 44.5,15" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
</svg>
